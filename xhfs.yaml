password: helloworld
# key_derivation:
#   algorithm: argon2     # default: sha256
#   memory_cost: 65536    # default: 65536
#   time_cost: 3          # default: 3
#   parallelism: 4        # default: 4
devices:
  - type: file
    name: blob1
    path: ./part1.bin
  - type: file
    name: blob2
    path: ./part1-replica.bin
  - type: file
    name: blob3
    path: ./part2.bin
configuration:
  logical:
    - name: dev1
      # The data will be replicated accross these block devices.
      # The first block device will be the main block for reads
      # and we can swap the order if we suspect corruption
      include: [blob1, blob2]
      capacity: "50 MiB"
      max_concurrent: 2
    - name: dev2
      include: [blob3]
      capacity: "50 MiB"
      max_concurrent: 1
  # Final storage layout
  # [dev1: 0 - 50MB] [dev2: 50MiB - 100MiB]
  layout: [dev1, dev2]
