# You can use --password if the config and bins are made public
password: helloworld
devices:
  - type: file
    name: blob1
    path: ./part1.bin
  - type: file
    name: blob2
    path: ./part1-replica.bin
  - type: file
    name: blob3
    path: ./part2.bin
configuration:
  logical:
    - name: dev1
      include: [blob1, blob2]
      capacity: "90 MiB"
      max_concurrent: 2
    - name: dev2
      include: [blob3]
      capacity: "2 MiB"
      max_concurrent: 1
  layout: [dev1, dev2]
