# the drive will be encrypted
password: helloworld
devices:
  - type: kvhttp
    name: bloc1
    url: http://localhost:8000
    slot_capacity_bytes: 2000000 # how much a key can hold
  - type: kvhttp
    name: bloc2
    url: http://localhost:8000
    slot_capacity_bytes: 123456 # this is an example, but ideally make it a power of 2
    headers:
      foo: bar
  - type: kvhttp
    name: bloc3
    url: http://localhost:8000
    slot_capacity_bytes: 1234
configuration:
  logical:
    - name: dev1
      include: [bloc1]
      capacity: "10 MiB"
      max_concurrent: 1
    - name: dev2
      include: [bloc2]
      capacity: "2 MiB"
      max_concurrent: 1
    - name: dev3
      include: [bloc3]
      capacity: "5 MiB"
      max_concurrent: 1
  layout: [dev1, dev2, dev3]
