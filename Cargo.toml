[package]
name = "brutefs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.44"
eyre = "0.6.12"
futures = "0.3.32"
tokio = { version = "1.52.3", features = ["full"] }
tracing = { version = "0.1.44", features = ["std"] }
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "std", "env-filter"] }
