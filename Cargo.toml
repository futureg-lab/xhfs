[package]
name = "brutefs"
version = "0.1.0"
edition = "2024"

[dependencies]
async-recursion = "1.1.1"
async-stream = "0.3.6"
async-trait = "0.1.89"
bytesize = "2.3.1"
chacha20 = "0.10.0"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
eyre = "0.6.12"
futures = "0.3.32"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tracing = { version = "0.1.44", features = ["std"] }
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "std", "env-filter"] }
